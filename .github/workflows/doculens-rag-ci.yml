name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate corpus fixtures
        run: python scripts/generate_corpus.py
      - name: Run tests (TF-IDF test embedder, no model download)
        run: DOCULENS_EMBEDDER=tfidf DOCULENS_GENERATOR=extractive pytest -q
